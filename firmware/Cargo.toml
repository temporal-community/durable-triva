[package]
name = "temporal-trivia-badge-firmware"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "temporal-trivia-badge-firmware"
harness = false

[features]
# The USB hardware-in-the-loop command reader is an acceptance-test tool, not a
# shipped capability: it injects a correct answer into a live round. Build the
# image people carry without it; build the one tools/test_physical_badges.py
# drives with `./build-firmware.sh --features hil`.
hil = []

[dependencies]
anyhow = "1"
badge-input = { path = "../badge-input" }
badge-screen = { path = "../badge-screen" }
esp-idf-svc = "=0.52.1"
futures = "0.3"
log = "0.4"
ring = { version = "=0.17.14", features = ["less-safe-getrandom-espidf"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
temporal-trivia-shared = { path = "../shared" }
temporalio-client = { version = "=0.7.0", default-features = false }
temporalio-common = { version = "=0.7.0", default-features = false }
temporalio-macros = "=0.7.0"
temporalio-sdk = { version = "=0.7.0", default-features = false }
temporalio-sdk-core = { version = "=0.7.0", default-features = false, features = ["tls-ring"] }
temporalio-workflow = { version = "=0.7.0", default-features = false }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
webpki-roots = "=1.0.9"

[build-dependencies]
embuild = "0.33"
temporal-trivia-shared = { path = "../shared" }
