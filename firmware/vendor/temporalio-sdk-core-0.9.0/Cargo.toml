[package]
edition = "2024"
rust-version = "1.88.0"
name = "temporalio-sdk-core"
version = "0.9.0"
authors = ["Temporal Technologies Inc. <sdk@temporal.io>"]
build = false
exclude = ["machine_coverage/*"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Library for building new Temporal SDKs"
homepage = "https://temporal.io/"
readme = "README.md"
keywords = [
    "temporal",
    "workflow",
]
categories = ["development-tools"]
license-file = "LICENSE.txt"
repository = "https://github.com/temporalio/sdk-rust"
resolver = "2"

[features]
antithesis_assertions = ["dep:antithesis_sdk"]
debug-plugin = [
    "dep:reqwest",
    "dep:hyper",
]
default = [
    "envconfig",
    "prometheus",
    "tls-ring",
]
dynamic-tls = ["temporalio-client/dynamic-tls"]
envconfig = [
    "temporalio-client/envconfig",
    "temporalio-common/envconfig",
]
ephemeral-server = [
    "dep:flate2",
    "dep:reqwest",
    "dep:tar",
    "dep:zip",
    "tokio/process",
]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "temporalio-common/otel",
]
prometheus = ["temporalio-common/prometheus"]
test-utilities = [
    "dep:assert_matches",
    "dep:bimap",
]
tls-aws-lc = [
    "temporalio-client/tls-aws-lc",
    "temporalio-common/tls-aws-lc",
    "opentelemetry-otlp?/tls-aws-lc",
    "reqwest?/rustls",
    "tonic/tls-native-roots",
]
tls-ring = [
    "temporalio-client/tls-ring",
    "temporalio-common/tls-ring",
    "opentelemetry-otlp?/tls-ring",
    "reqwest?/rustls-no-provider",
    "tonic/tls-native-roots",
]

[lib]
name = "temporalio_sdk_core"
path = "src/lib.rs"

[[bin]]
name = "histfetch"
path = "src/histfetch.rs"
required-features = ["test-utilities"]

[[test]]
name = "activities_procmacro"
path = "tests/activities_procmacro.rs"

[[test]]
name = "cloud_tests"
path = "tests/cloud_tests.rs"
test = false
required-features = ["test-utilities"]

[[test]]
name = "fsm_procmacro"
path = "tests/fsm_procmacro.rs"
required-features = ["temporalio-common/serde_serialize"]

[[test]]
name = "global_metric_tests"
path = "tests/global_metric_tests.rs"
test = false
required-features = ["test-utilities"]

[[test]]
name = "heavy_tests"
path = "tests/heavy_tests.rs"
test = false
required-features = ["test-utilities"]

[[test]]
name = "integ_runner"
path = "tests/runner.rs"
test = false
harness = false
required-features = [
    "temporalio-common/serde_serialize",
    "test-utilities",
    "ephemeral-server",
]

[[test]]
name = "integ_tests"
path = "tests/main.rs"
test = false
required-features = [
    "temporalio-common/serde_serialize",
    "test-utilities",
    "ephemeral-server",
]

[[test]]
name = "manual_tests"
path = "tests/manual_tests.rs"
test = false
required-features = ["test-utilities"]

[[test]]
name = "wasm_workflow_tests"
path = "tests/wasm_workflow_tests.rs"
test = false
required-features = [
    "temporalio-common/serde_serialize",
    "test-utilities",
    "ephemeral-server",
]

[[test]]
name = "workflows_procmacro"
path = "tests/workflows_procmacro.rs"

[[bench]]
name = "workflow_replay"
path = "benches/workflow_replay_bench.rs"
test = false
harness = false
required-features = ["test-utilities"]

