[package]
name = "temporal-trivia-web"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
futures = "0.3"
html-escape = "0.2"
prost-wkt-types = "0.7"
rand = "0.9"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
temporal-trivia-shared = { path = "../shared" }
temporalio-client = { version = "=0.7.0", default-features = false }
temporalio-common = { version = "=0.7.0", default-features = false, features = ["envconfig"] }
temporalio-macros = "=0.7.0"
temporalio-sdk = { version = "=0.7.0", default-features = false }
temporalio-sdk-core = { version = "=0.7.0", default-features = false, features = ["tls-ring"] }
temporalio-workflow = { version = "=0.7.0", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "simulate-badges"
path = "src/bin/simulate_badges.rs"

[[bin]]
name = "simulate-phones"
path = "src/bin/simulate_phones.rs"

[dev-dependencies]
# The deck has to be renderable on the badge, not just on the TV.
badge-screen = { path = "../badge-screen" }
